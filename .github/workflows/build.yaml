name: Build source list

on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "crates/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "sources/**"
      - "crates/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sources/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ./.github/actions/install-aidoku-cli

      - name: Check sources
        run: |
          set -euo pipefail

          (cd crates/cbr-native && cargo fmt --check && cargo test --locked)

          cd sources/multi.silo
          cargo fmt --check
          cargo clippy --locked --tests -- -D warnings
          cargo test --locked -- test_unit_

          # The v2 contract tests run against a local mock; the live tests
          # need a real Silo server and stay manual.
          python3 tests/mock_silo_v2.py &
          mock=$!
          trap 'kill "$mock"' EXIT
          for _ in $(seq 50); do
            curl -sf http://127.0.0.1:8799/api/v2/system/info >/dev/null && break
            sleep 0.2
          done
          cargo test --locked -- --ignored test_mock_

      - name: Build sources
        run: |
          set -euo pipefail

          for source in sources/*; do
            [[ -f "$source/Cargo.toml" ]] || continue

            echo "::group::Packaging $source"
            (
              cd "$source"
              aidoku package
              aidoku verify package.aix
            )
            echo "::endgroup::"
          done

      - name: Build source list
        run: |
          aidoku build sources/*/package.aix --name "Silo Sources"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list
          single-commit: true

      - name: Uploading packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: public/sources/*.aix
          if-no-files-found: ignore
