[package]
name = "silo"
version = "0.1.0"
edition = "2024"

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["json"] }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
wasmi2 = { package = "wasmi", version = "=2.0.0", default-features = false, features = ["stable", "validate", "portable-dispatch", "libm", "prefer-btree-collections"], optional = true }

silo-cbr-native = { path = "../../experiments/cbr-native", optional = true }

[features]
default = ["cbr-native"]
cbr-wasm = ["dep:wasmi2"]
cbr-native = ["dep:silo-cbr-native"]

[dev-dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["test"] }
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs.git" }

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
